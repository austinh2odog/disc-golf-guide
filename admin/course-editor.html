<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Course CSV Admin</title><style>body{font:14px system-ui;margin:20px;background:#f8f5ef}button{padding:9px;margin:3px}textarea{width:100%;height:70vh;font:12px monospace}</style></head><body><h1>Course Library Admin</h1><p>Edit the hole-by-hole CSV. Keep one row per hole and preserve layout_id for existing layouts.</p><button id="load">Load data/courses.csv</button><button id="download">Download courses.csv</button><textarea id="csv"></textarea><script>load.onclick=async()=>csv.value=await(await fetch('../data/courses.csv',{cache:'no-store'})).text();download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv.value],{type:'text/csv'}));a.download='courses.csv';a.click();URL.revokeObjectURL(a.href)};load.click()</script></body></html>
