<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disc Golf Guide</title><meta name="theme-color" content="#1a3c2e"><link rel="icon" type="image/png" href="./dog-logo.png"><link rel="apple-touch-icon" href="./dog-logo.png"><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--g:#1a3c2e;--bg:#f8f5ef;--line:#e5dcc8;--muted:#6b6b6b}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:#1a1a1a}.wrap{max-width:820px;margin:auto;padding:14px 14px 85px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.hidden{display:none!important}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 12px}.mini{font-size:12px;color:var(--muted)}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}select,input{width:100%;padding:11px;border:1px solid #d4c9ad;border-radius:10px;background:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:white}.soft{background:#f0ead9}.wide{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f8f5ef;border-radius:10px;padding:9px}.stat b{display:block;font-size:20px}.shot,.hist{padding:9px;border-bottom:1px solid var(--line)}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}.tabs{max-width:820px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);padding:7px}.tab{background:#fff}.tab.on{background:#f5e9b3}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end}.sheet{max-width:820px;width:100%;margin:auto;background:white;padding:16px;border-radius:18px 18px 0 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #d4c9ad;background:white}.chip.on{background:var(--g);color:white}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card" style="display:flex;align-items:center;gap:12px"><img src="./dog-logo.png" alt="Disc Golf Guide dog icon" style="width:54px;height:54px;border-radius:12px;object-fit:cover"><div><strong style="font-size:18px">Disc Golf Guide</strong><div class="mini">Global courses from CSV · personal data stays local</div></div></div><div class="card"><h1>Scorecard & round history</h1><div id="loadStatus" class="mini">Loading global course library…</div></div>
<section id="play"><div id="setup" class="card"><h2>Start a Round</h2><label>Course / Layout</label><select id="layout"></select><div id="personalBox" class="hidden"><div class="row"><div><label>Course</label><input id="pcourse"></div><div><label>Layout</label><input id="playout" value="Main"></div></div><div class="row"><div><label>Holes</label><input id="pholes" type="number" value="9"></div><div><label>Default par</label><input id="ppar" type="number" value="3"></div></div><button id="savePersonal" class="soft wide">Save Personal Course / Layout</button></div><div class="row"><div><label>Date</label><input id="date" type="date"></div><div><label>Starting hole</label><input id="startHole" type="number" value="1" min="1"></div></div><button id="start" class="primary wide">Start Round</button></div>
<div id="round" class="hidden"><div class="stats card"><div class="stat"><b id="rscore">E</b>Round</div><div class="stat"><b id="done">0</b>Holes</div><div class="stat"><b id="throws">0</b>Throws</div></div><div class="card"><div class="mini" id="rname"></div><h2 id="hname"></h2><div id="hmeta"></div><div class="row"><button id="prev" class="soft">Previous</button><button id="next" class="soft">Next</button></div></div><div class="card"><h2>Shots</h2><div id="shots"></div><button id="addShot" class="primary wide">+ Add Shot</button></div><div class="card"><button id="finish" class="soft wide">Finish & Save Round</button></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Round History</h2><select id="histFilter"></select><div id="histList"></div></div></section><section id="stats" class="hidden"><div class="card"><h2>Course & Hole Stats</h2><select id="statLayout"></select><label>Hole</label><select id="statHole"><option value="all">All holes</option></select><div id="statBody"></div></div></section></div>
<nav><div class="tabs"><button class="tab on" data-page="play">Scorecard</button><button class="tab" data-page="stats">Stats</button><button class="tab" data-page="history">Rounds</button></div></nav><div id="modal" class="modal hidden"><div class="sheet"><h2>Add Shot</h2><label>Disc</label><div id="discChips" class="chips"></div><label>Landing / lie</label><div id="lieChips" class="chips"></div><label>Distance (optional)</label><input id="sdist" type="number"><div class="row"><button id="cancel" class="soft">Cancel</button><button id="saveShot" class="primary">Save</button></div></div></div>
<script>
const $=id=>document.getElementById(id),K={personal:'dgg.personalCourses.v4',rounds:'dgg.rounds.v4',active:'dgg.active.v4'},read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let globalLayouts=[],personal=read(K.personal,[]),rounds=read(K.rounds,[]),active=read(K.active,null),hi=0,disc='',lie='';$('date').value=new Date().toISOString().slice(0,10);const lies=['Fairway','C1','C2','Rough (Trees)','Rough (Brush)','Rough (Tall Grass)','OB','Basket'];
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}let h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]??''])))}
async function loadCourses(){try{let r=await fetch('./data/courses.csv',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let rows=parseCSV(await r.text()),m=new Map;rows.forEach(x=>{if(!m.has(x.layout_id))m.set(x.layout_id,{id:x.layout_id,course:x.course,layout:x.layout,source:x.source,verified:x.verified,holes:[]});m.get(x.layout_id).holes.push({number:+x.hole,distance:+x.distance_ft||null,par:+x.par})});globalLayouts=[...m.values()];$('loadStatus').textContent=globalLayouts.length+' global layouts loaded from courses.csv';refresh()}catch(e){$('loadStatus').textContent='Could not load data/courses.csv. Run the app from GitHub Pages or a local web server.';refresh()}}
const all=()=>[...globalLayouts,...personal],score=n=>n===0?'E':n>0?'+'+n:String(n),opt=l=>`<option value="${l.id}">${l.course} — ${l.layout}${l.source==='included'?' · Verified '+l.verified:''}</option>`;function refresh(){let g=globalLayouts.map(opt).join(''),p=personal.map(opt).join('');$('layout').innerHTML=`<optgroup label="Global Courses">${g}</optgroup><optgroup label="My Courses">${p||'<option disabled>None yet</option>'}</optgroup><option value="__new__">＋ Add Personal Course / Layout</option>`;$('histFilter').innerHTML='<option value="all">All layouts</option>'+all().map(opt).join('');$('statLayout').innerHTML='<option value="">Select layout</option>'+all().map(opt).join('')}
function bag(){try{return parent.getInBagDiscs().map(d=>parent.getDiscDisplayNamePlain(d))}catch(e){return['Putter','Midrange','Fairway','Driver']}}function hole(){return active.holes[hi]}function render(){let on=!!active;$('setup').classList.toggle('hidden',on);$('round').classList.toggle('hidden',!on);if(!on)return;let h=hole(),done=active.holes.filter(x=>x.complete);$('rname').textContent=active.course+' — '+active.layout;$('hname').textContent='Hole '+h.number;$('hmeta').textContent='Par '+h.par+(h.distance?' · '+h.distance+' ft':'');$('shots').innerHTML=h.shots.map((s,i)=>`<div class="shot"><b>${i+1}. ${s.disc}</b> → ${s.location}${s.distance?' · '+s.distance+' ft':''}</div>`).join('')||'<div class="mini">No shots yet.</div>';$('rscore').textContent=score(done.reduce((a,x)=>a+x.shots.length-x.par,0));$('done').textContent=done.length;$('throws').textContent=active.holes.reduce((a,x)=>a+x.shots.length,0);$('addShot').disabled=h.complete}
$('layout').onchange=()=>$('personalBox').classList.toggle('hidden',$('layout').value!=='__new__');$('savePersonal').onclick=()=>{let c=$('pcourse').value.trim(),l=$('playout').value.trim();if(!c||!l)return;let n=+$('pholes').value||9,p=+$('ppar').value||3,x={id:'personal-'+Date.now(),course:c,layout:l,source:'personal',verified:'',holes:Array.from({length:n},(_,i)=>({number:i+1,par:p,distance:null}))};personal.push(x);write(K.personal,personal);refresh();$('layout').value=x.id;$('personalBox').classList.add('hidden')};$('start').onclick=()=>{let l=all().find(x=>x.id===$('layout').value);if(!l)return;active={id:String(Date.now()),layoutId:l.id,course:l.course,layout:l.layout,date:$('date').value,holes:l.holes.map(h=>({...h,complete:false,shots:[]}))};hi=Math.max(0,Math.min(active.holes.length-1,(+$('startHole').value||1)-1));write(K.active,active);render()};$('prev').onclick=()=>{if(hi){hi--;render()}};$('next').onclick=()=>{if(hi<active.holes.length-1){hi++;render()}};$('addShot').onclick=()=>{disc='';lie='';$('discChips').innerHTML=bag().map(x=>`<button class="chip" data-d="${x}">${x}</button>`).join('');$('lieChips').innerHTML=lies.map(x=>`<button class="chip" data-l="${x}">${x}</button>`).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{disc=b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lie=b.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))});$('modal').classList.remove('hidden')};$('cancel').onclick=()=>$('modal').classList.add('hidden');$('saveShot').onclick=()=>{if(!disc||!lie)return;hole().shots.push({disc,location:lie,distance:+$('sdist').value||null});if(lie==='Basket')hole().complete=true;write(K.active,active);$('modal').classList.add('hidden');render()};$('finish').onclick=()=>{if(!confirm('Finish and save?'))return;rounds.unshift(active);write(K.rounds,rounds);localStorage.removeItem(K.active);active=null;render();renderHistory()};function renderHistory(){let f=$('histFilter').value||'all',rs=rounds.filter(r=>f==='all'||r.layoutId===f);$('histList').innerHTML=rs.map(r=>{let d=r.holes.filter(h=>h.complete),v=d.reduce((a,h)=>a+h.shots.length-h.par,0);return `<div class="hist"><b>${r.course} — ${r.layout}</b><div class="mini">${r.date} · ${d.length} holes · ${score(v)}</div></div>`}).join('')||'<div class="mini">No saved rounds.</div>'}$('histFilter').onchange=renderHistory;function statHoles(){let l=all().find(x=>x.id===$('statLayout').value);$('statHole').innerHTML='<option value="all">All holes</option>'+(l?l.holes.map((h,i)=>`<option value="${i}">Hole ${i+1}</option>`).join(''):'');renderStats()}function renderStats(){let id=$('statLayout').value,hv=$('statHole').value,rs=rounds.filter(r=>r.layoutId===id);if(!id||!rs.length){$('statBody').innerHTML='<div class="mini">No rounds for this layout.</div>';return}if(hv==='all'){let a=rs.map(r=>r.holes.filter(x=>x.complete).reduce((n,h)=>n+h.shots.length-h.par,0));$('statBody').innerHTML=`<div class="stats"><div class="stat"><b>${rs.length}</b>Rounds</div><div class="stat"><b>${score(Math.min(...a))}</b>Best</div><div class="stat"><b>${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)}</b>Avg +/-</div></div>`;return}let n=+hv;$('statBody').innerHTML=rs.map(r=>({d:r.date,h:r.holes[n]})).filter(x=>x.h&&x.h.complete).map(x=>`<div class="hist"><b>${x.d} · ${x.h.shots.length} on par ${x.h.par}</b><div class="mini">${x.h.shots.map((s,i)=>(i+1)+'. '+s.disc+' → '+s.location).join(' | ')}</div></div>`).join('')}$('statLayout').onchange=statHoles;$('statHole').onchange=renderStats;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{['play','history','stats'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.page));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.page==='history')renderHistory();if(b.dataset.page==='stats')renderStats()});loadCourses();render();renderHistory();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}</script></body></html>
